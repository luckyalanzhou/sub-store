name: Build sub-store installer

on:
  workflow_dispatch:
    inputs:
      bump:
        description: patch=兼容性修复，minor=向后兼容的新功能，major=不兼容的变更
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
        required: true
  schedule:
    - cron: '17 3 * * 1'

concurrency:
  group: sub-store-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  docker-smoke:
    name: Test current official Docker image
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Start and verify official split-mode container
        shell: bash
        run: |
          set -euo pipefail
          api_path=$(openssl rand -hex 24)
          cleanup() {
            docker rm -f sub-store-smoke >/dev/null 2>&1 || true
            docker volume rm sub-store-smoke-data >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker volume create sub-store-smoke-data >/dev/null
          docker run -d \
            --name sub-store-smoke \
            -e TZ=Asia/Shanghai \
            -e SUB_STORE_FRONTEND_HOST=0.0.0.0 \
            -e SUB_STORE_FRONTEND_PORT=3001 \
            -e SUB_STORE_BACKEND_API_HOST=0.0.0.0 \
            -e SUB_STORE_BACKEND_API_PORT=3000 \
            -e SUB_STORE_BACKEND_MERGE= \
            -e "SUB_STORE_FRONTEND_BACKEND_PATH=/$api_path" \
            -e SUB_STORE_BACKEND_PREFIX=true \
            -v sub-store-smoke-data:/opt/app/data \
            xream/sub-store:latest
          for attempt in $(seq 1 60); do
            if docker exec -i sub-store-smoke node --input-type=commonjs - \
              < installer/payload/root/usr/lib/sub-store/healthcheck.js; then
              docker inspect -f 'image={{.Image}} created={{.Created}}' sub-store-smoke
              exit 0
            fi
            sleep 2
          done
          docker logs --tail 100 sub-store-smoke
          exit 1

  prepare-release:
    name: Allocate or resume release version
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      tag: ${{ steps.prepare.outputs.tag }}
      source_sha: ${{ steps.prepare.outputs.source_sha }}
      previous_tag: ${{ steps.prepare.outputs.previous_tag }}
      run_ids: ${{ steps.prepare.outputs.run_ids }}
      already_complete: ${{ steps.prepare.outputs.already_complete }}
    steps:
      - name: Check out the selected main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Create or resume the draft release
        id: prepare
        run: python3 scripts/release.py prepare
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
          BUMP_TYPE: ${{ inputs.bump || 'patch' }}

  build:
    name: Build, verify, and publish release
    if: github.event_name == 'workflow_dispatch' && needs.prepare-release.outputs.already_complete != 'true'
    needs: [docker-smoke, prepare-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out the allocated release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare-release.outputs.source_sha }}

      - name: Generate numbered release notes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          {
            printf '# sub-store v%s\n\n' "$VERSION"
            printf '安装器目标版本：iStoreOS 24.10（opkg）和 25.12（apk）。提供 `.run` 自解压安装器和 SHA-256 校验文件；首次启动需要联网拉取官方镜像。\n\n'
            printf '## 优化内容\n\n'
            index=0
            if [[ -n "$PREVIOUS_TAG" ]]; then
              commits=$(git rev-list --reverse "$PREVIOUS_TAG..$SOURCE_SHA")
            else
              commits=$(git rev-list --reverse "$SOURCE_SHA")
            fi
            while IFS= read -r commit; do
              subject="$(git show -s --format=%s "$commit")"
              [[ "$subject" == *"[skip ci]"* ]] && continue
              body="$(git show -s --format=%b "$commit")"
              index=$((index + 1))
              printf '%d. %s\n' "$index" "$subject"
              if [[ -n "$body" ]]; then
                while IFS= read -r line; do
                  [[ -z "$line" ]] || printf '   %s\n' "$line"
                done <<< "$body"
              fi
              printf '\n'
            done <<< "$commits"
            if ((index == 0)); then
              if [[ -z "$PREVIOUS_TAG" ]]; then
                printf '1. 首次发布：提供 sub-store iStoreOS 手动安装包。\n'
              else
                printf '1. 本次继续完成已分配版本的发布。\n'
              fi
            fi
            printf '\n<!-- sub-store-run-ids: %s -->\n' "$RUN_IDS"
          } > dist/release-notes.md
          cat dist/release-notes.md
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
          SOURCE_SHA: ${{ needs.prepare-release.outputs.source_sha }}
          PREVIOUS_TAG: ${{ needs.prepare-release.outputs.previous_tag }}
          RUN_IDS: ${{ needs.prepare-release.outputs.run_ids }}

      - name: Install packaging and validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends makeself lua5.1 busybox-static zstd

      - name: Run shared validation suite
        run: bash scripts/validate.sh

      - name: Build installer
        run: sh scripts/build-run.sh
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}

      - name: Create and verify SHA-256 file
        shell: bash
        run: |
          set -euo pipefail
          package="sub-store-${VERSION}.run"
          (cd dist && sha256sum "$package" > "${package}.sha256")
          (cd dist && sha256sum --check --strict "${package}.sha256")
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}

      - name: Verify package and self-extractor
        shell: bash
        run: |
          set -euo pipefail
          package="dist/sub-store-${VERSION}.run"
          checksum="${package}.sha256"
          test -s "$package"
          test -s "$checksum"
          (cd dist && sha256sum --check --strict "$(basename "$checksum")")

          "$package" --check
          extracted="$(mktemp -d)"
          trap 'rm -rf "$extracted"' EXIT
          "$package" --noexec --target "$extracted"
          test "$(stat -c '%a' "$extracted/root/www/luci-static/resources/view/sub-store")" = 755
          test "$(stat -c '%a' "$extracted/root/www/luci-static/resources/view/sub-store/manage.js")" = 644
          test "$(stat -c '%a' "$extracted/root/usr/lib/sub-store/app-version.js")" = 644

          set +e
          output=$(sh "$package" 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          grep -Fq 'Run the .run installer as root.' <<<"$output"
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sub-store-${{ needs.prepare-release.outputs.version }}
          path: |
            dist/sub-store-${{ needs.prepare-release.outputs.version }}.run
            dist/sub-store-${{ needs.prepare-release.outputs.version }}.run.sha256
            dist/release-notes.md
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      - name: Upload, verify, and publish the draft release
        run: python3 scripts/release.py publish
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
          RUN_IDS: ${{ needs.prepare-release.outputs.run_ids }}
          GITHUB_RUN_ID: ${{ github.run_id }}
